<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <title>You're offline · SplitMate</title>
    <link rel="icon" href="/icons/logo.svg" type="image/svg+xml" />
    <!-- Served by the service worker when a page can't be loaded. Static on
         purpose: it holds no user or financial data. -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #171717;
        --muted: #636363;
        --border: #e5e5e5;
        --primary: #15803d;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --fg: #fafafa;
          --muted: #a3a3a3;
          --border: #262626;
          --primary: #22c55e;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        max-width: 26rem;
        text-align: center;
        display: grid;
        gap: 12px;
        justify-items: center;
      }
      h1 {
        margin: 8px 0 0;
        font-size: 1.5rem;
        line-height: 1.25;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      button {
        margin-top: 12px;
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 10px;
        background: var(--primary);
        color: #ffffff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        button {
          color: #0a0a0a;
        }
      }
      button:focus-visible {
        outline: 3px solid var(--primary);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/logo.svg" alt="" width="56" height="56" />
      <h1>You're offline</h1>
      <p>SplitMate needs a connection to show your balances and save changes. Nothing was saved while you were offline.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
