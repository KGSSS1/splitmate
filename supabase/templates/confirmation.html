<!-- Sign-up confirmation. The app passes emailRedirectTo = <app>/auth/confirm. -->
<h2>Confirm your SplitMate account</h2>
<p>Thanks for signing up. Confirm your email address to start sharing expenses:</p>
<p><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=email">Confirm my email</a></p>
<p>If you didn't create a SplitMate account, you can ignore this email.</p>
